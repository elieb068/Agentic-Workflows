{% extends "_base.html" %}
{% block title %}{{ title }} · Raio-X IA{% endblock %}
{% block content %}
<div class="card">
<h1>{{ title }}</h1>
<p>{{ message }}</p>
<form method="post" action="{{ action }}">
<button type="submit" style="font-size:16px;padding:10px 18px;border:0;border-radius:6px;background:{{ color }};color:#fff;cursor:pointer">{{ button }}</button>
</form>
</div>
{% endblock %}
