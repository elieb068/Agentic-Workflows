<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
{% block head %}{% endblock %}
<title>{% block title %}Raio-X IA{% endblock %}</title>
<style>
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:#1f2933;background:#f4f5f7;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:24px 16px}
.card{background:#fff;border-radius:8px;padding:20px 24px;margin-bottom:16px}
.score{font-size:40px;font-weight:700}.muted{color:#616e7c}
.ok{color:#15803d}.aviso{color:#b45309}.erro{color:#b91c1c}.indeterminado{color:#616e7c}
</style>
</head>
<body><main>
<p><strong>Raio-X IA</strong> <span class="muted">· versão provisória (M2)</span></p>
{% block content %}{% endblock %}
</main></body>
</html>
