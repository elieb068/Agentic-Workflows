<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ subject }}</title>
</head>
<body style="margin:0;padding:0;background:#f4f5f7;font-family:Arial,Helvetica,sans-serif;color:#1f2933;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f5f7;">
<tr><td align="center" style="padding:24px 12px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border-radius:8px;">
<tr><td style="padding:24px 28px 8px;font-size:20px;font-weight:bold;">Raio-X IA</td></tr>
<tr><td style="padding:8px 28px 24px;font-size:16px;line-height:1.5;">
{% block body %}{% endblock %}
</td></tr>
<tr><td style="padding:16px 28px;border-top:1px solid #e4e7eb;font-size:12px;line-height:1.5;color:#616e7c;">
{% block footer %}Você recebeu este e-mail porque pediu um Raio-X IA em <a href="{{ base_url }}" style="color:#616e7c;">{{ base_url | replace("https://", "") }}</a>.{% endblock %}
<br><a href="{{ privacy_url }}" style="color:#616e7c;">Privacidade</a>{% if unsubscribe_url %} · <a href="{{ unsubscribe_url }}" style="color:#616e7c;">Não quero mais receber e-mails</a>{% endif %}
</td></tr>
</table>
</td></tr>
</table>
</body>
</html>
