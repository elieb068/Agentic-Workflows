<header class="border-b border-slate-400/15">
  <div class="container-page flex flex-wrap items-center justify-between gap-4 py-4">
    <a href="/" class="flex min-h-11 items-center gap-3.5 no-underline">
      <img src="{{ static_url('img/prime-logo-60.png') }}" alt="Prime Solutions" width="96" height="30" class="logo-on-dark h-[30px] w-auto">
      <span aria-hidden="true" class="h-[26px] w-px bg-slate-400/35"></span>
      <span class="font-display text-xl font-bold tracking-wide text-slate-100">Raio-X IA</span>
    </a>
    {% if nav == "landing" %}
    <nav aria-label="Principal" class="flex flex-wrap items-center gap-x-6 gap-y-2 text-sm font-semibold tracking-wider uppercase">
      <a href="#como-funciona" class="hidden text-slate-400 no-underline hover:text-slate-200 lg:inline">Como funciona</a>
      <a href="#o-que-verificamos" class="hidden text-slate-400 no-underline hover:text-slate-200 sm:inline">O que verificamos</a>
      <a href="/guias" class="hidden text-slate-400 no-underline hover:text-slate-200 sm:inline">Guias</a>
      <a href="#formulario" class="btn btn-primary px-5 text-sm">Fazer meu Raio-X</a>
    </nav>
    {% elif nav == "report" %}
    <a href="/" class="btn btn-ghost px-5 text-sm">Analisar outro site</a>
    {% elif nav == "guides" %}
    <nav aria-label="Principal" class="flex flex-wrap items-center gap-x-6 gap-y-2 text-sm font-semibold tracking-wider uppercase">
      <a href="/guias" class="hidden text-slate-400 no-underline hover:text-slate-200 sm:inline">Guias</a>
      <a href="/#formulario" class="btn btn-primary px-5 text-sm">Fazer meu Raio-X</a>
    </nav>
    {% endif %}
  </div>
</header>
