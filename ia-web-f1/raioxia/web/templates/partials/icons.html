{# Inline stroke icons, decorative (aria-hidden). Usage: {% from "partials/icons.html" import icon %} then {{ icon("check") }} #}
{% macro icon(name, size=18, cls="") -%}
<svg aria-hidden="true" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" class="flex-none {{ cls }}">
{%- if name == "check" %}<path d="M20 6 9 17l-5-5"/>
{%- elif name == "warning" %}<path d="M12 8v5M12 17h.01"/><path d="M10.3 3.9 2.4 17.6A2 2 0 0 0 4.1 20.6h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>
{%- elif name == "error" %}<circle cx="12" cy="12" r="9"/><path d="m15 9-6 6M9 9l6 6"/>
{%- elif name == "unknown" %}<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.5v.7M12 17h.01"/>
{%- elif name == "arrow" %}<path d="M5 12h14M13 6l6 6-6 6"/>
{%- elif name == "eye" %}<circle cx="12" cy="12" r="3"/><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/>
{%- elif name == "mail" %}<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>
{%- elif name == "clock" %}<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
{%- elif name == "inbox" %}<path d="M4 4h16v12H5.2L4 17.2z"/>
{%- elif name == "alert" %}<circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5h.01"/>
{%- elif name == "spinner" %}<path d="M12 3a9 9 0 1 0 9 9"/>
{%- endif %}
</svg>
{%- endmacro %}
